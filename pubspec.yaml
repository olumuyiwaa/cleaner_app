name: cleaner_app
description: Tod Cleaning Services - cleaner app (jobs, check-in, checklists, photos, earnings, leave).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, routing, networking
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  intl: ^0.19.0

  # Device features
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  url_launcher: ^6.3.0

  # Push notifications (optional at runtime: the app works without Firebase config)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
